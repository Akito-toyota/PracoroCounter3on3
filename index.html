<html lang="ja">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>PracoroCounter</title>

<link rel="manifest" href="./manifest.json">

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="./icon-180.png?v=4"
>

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./icon-192.png?v=4"
>

<link
  rel="icon"
  type="image/png"
  sizes="512x512"
  href="./icon-512.png?v=4"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="PracoroCounter"
>

<meta
  name="application-name"
  content="PracoroCounter"
>

<meta
  name="theme-color"
  content="#030609"
>

<style>
:root{
  --page-bg:#030609;
  --panel:#080d14;
  --monitor:#03070b;
  --line:#26374d;
  --line-strong:#38506d;
  --text:#f4f7fb;
  --muted:#718198;

  --green:#00d98b;
  --yellow:#ffd400;
  --red:#ff334f;

  --app-height:100svh;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;
  overscroll-behavior:none;

  background:var(--page-bg);
}

body{
  position:fixed;
  inset:0;

  width:100%;
  height:var(--app-height);

  background:var(--page-bg);
  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  touch-action:manipulation;

  -webkit-user-select:none;
  user-select:none;
}

button,
select{
  font-family:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

/* =========================
   全体
========================= */

.app{
  width:100%;
  max-width:600px;

  height:var(--app-height);

  margin:0 auto;

  padding-top:
    max(4px,env(safe-area-inset-top));

  padding-right:
    max(7px,env(safe-area-inset-right));

  padding-bottom:
    max(7px,env(safe-area-inset-bottom));

  padding-left:
    max(7px,env(safe-area-inset-left));

  display:flex;
  flex-direction:column;

  gap:5px;

  overflow:hidden;
}

/* =========================
   上部操作
========================= */

.top-control{
  width:100%;
  height:52px;
  flex:0 0 52px;

  display:grid;
  grid-template-columns:minmax(0,1fr) 84px;

  gap:6px;
}

.select-frame{
  min-width:0;
  position:relative;
}

.pokemon-select{
  width:100%;
  height:52px;

  padding:5px 38px 5px 10px;

  appearance:none;
  -webkit-appearance:none;

  background:#0b121d;
  color:#ffffff;

  border:1px solid var(--line-strong);
  border-radius:11px;

  font-size:clamp(19px,5vw,25px);
  font-weight:950;

  text-align:center;
  text-align-last:center;

  outline:none;

  cursor:pointer;
  touch-action:manipulation;
}

.pokemon-select option{
  background:#ffffff;
  color:#000000;

  font-weight:800;
}

.pokemon-select:focus{
  border-color:var(--green);
}

.select-frame::after{
  content:"▼";

  position:absolute;
  right:14px;
  top:50%;

  transform:translateY(-50%);

  color:#ffffff;

  font-size:11px;

  pointer-events:none;
}

.reset{
  width:84px;
  height:52px;

  padding:5px;

  background:#172131;
  color:#ffffff;

  border:1px solid var(--line-strong);
  border-radius:11px;

  font-size:13px;
  font-weight:950;

  cursor:pointer;
  touch-action:manipulation;
}

.reset:active{
  transform:scale(.96);
  background:#223147;
}

/* =========================
   外枠
========================= */

.card{
  width:100%;

  flex:1 1 auto;
  min-height:0;

  padding:4px;

  background:var(--panel);

  border:1px solid var(--line);
  border-radius:16px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================
   モニター
========================= */

.digital-unit{
  width:100%;
  height:100%;

  min-height:0;

  padding:4px;

  background:var(--monitor);

  border:1px solid #2c425d;
  border-radius:13px;

  display:grid;

  /*
    1. 上部表示
    2. キャラクター情報
    3. HPゲージ
    4. 進化ボタン
    5. 操作説明
    6. 下部数値
  */
  grid-template-rows:
    17px
    175px
    minmax(0,1fr)
    48px
    18px
    18px;

  overflow:hidden;

  position:relative;
}

/* =========================
   モニター上部
========================= */

.digital-header{
  width:100%;
  min-width:0;

  padding:0 5px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:var(--muted);

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:8px;
  font-weight:900;

  letter-spacing:1.2px;
}

#monitorName{
  min-width:0;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.status-area{
  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:4px;
}

.status-light{
  width:7px;
  height:7px;

  background:var(--green);

  border-radius:50%;

  box-shadow:
    0 0 8px rgba(0,217,139,.8);
}

/* =========================
   キャラクター情報
========================= */

.character-section{
  width:100%;
  min-height:0;

  padding:7px 14px 5px;

  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    minmax(145px,1fr);

  gap:18px;

  align-items:center;

  overflow:hidden;
}

.character-frame{
  width:100%;
  max-width:178px;

  aspect-ratio:1 / 1;

  justify-self:center;

  background:#030609;

  border:none;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  position:relative;
}

.character-image{
  width:100%;
  height:100%;

  padding:0;

  display:block;

  object-fit:contain;

  image-rendering:pixelated;
}

.character-image.is-hidden{
  display:none;
}

.character-placeholder{
  padding:12px;

  color:#65748a;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:11px;
  font-weight:900;

  text-align:center;

  line-height:1.6;
}

.character-placeholder.is-hidden{
  display:none;
}

/* =========================
   タイプ・弱点
========================= */

.attribute-panel{
  min-width:0;

  display:flex;
  flex-direction:column;

  gap:20px;
}

.attribute-row{
  width:100%;

  display:grid;
  grid-template-columns:minmax(0,1fr) 54px;

  gap:8px;

  align-items:center;
}

.attribute-label{
  color:#ffffff;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:clamp(14px,3.8vw,19px);
  font-weight:950;

  white-space:nowrap;
}

.attribute-icon-frame{
  width:54px;
  height:54px;

  background:#111827;

  border:1px solid #304057;
  border-radius:4px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  position:relative;
}

.attribute-icon{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
}

.attribute-icon.is-hidden{
  display:none;
}

.attribute-fallback{
  color:#ffffff;

  font-size:29px;
  font-weight:950;

  text-align:center;
}

.attribute-fallback.is-hidden{
  display:none;
}

/* =========================
   HPゲージ領域

   ここで必ず中央配置
========================= */

.dial-stage{
  width:100%;
  height:100%;

  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:visible;
}

/* =========================
   正方形サイズの管理
========================= */

.dial-area{
  width:min(
    88vw,
    calc(var(--app-height) - 400px),
    380px
  );

  max-width:100%;

  aspect-ratio:1 / 1;

  flex:0 0 auto;

  position:relative;
}

/* =========================
   操作領域
========================= */

.dial-container{
  width:100%;
  height:100%;

  position:relative;

  cursor:grab;

  touch-action:none;
  overscroll-behavior:none;

  -webkit-user-select:none;
  user-select:none;
}

.dial-container.dragging{
  cursor:grabbing;
}

.hp-dial{
  width:100%;
  height:100%;

  display:block;

  overflow:visible;

  touch-action:none;
  overscroll-behavior:none;
}

/* =========================
   円外装
========================= */

.outer-case{
  fill:#030609;

  stroke:#263b56;
  stroke-width:5;
}

.outer-case-detail{
  fill:none;

  stroke:#101a28;
  stroke-width:10;
}

/* =========================
   HPゲージ
========================= */

.dial-track{
  fill:none;

  stroke:#1d2938;
  stroke-width:24;
}

.dial-progress{
  fill:none;

  stroke:var(--green);
  stroke-width:24;

  transform:rotate(-90deg);
  transform-origin:180px 180px;
}

/* =========================
   中央部
========================= */

.dial-center{
  fill:#030609;

  stroke:#293e59;
  stroke-width:4;
}

.dial-center-inner{
  fill:#050a10;

  stroke:#16263a;
  stroke-width:2;
}

/* =========================
   HP数値
========================= */

.dial-hp-label{
  fill:#718198;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:17px;
  font-weight:900;

  letter-spacing:6px;

  text-anchor:middle;
}

.dial-hp-value{
  fill:var(--green);

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:82px;
  font-weight:950;

  text-anchor:middle;

  font-variant-numeric:tabular-nums;
}

.dial-unit-label{
  fill:#5f6f85;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:11px;
  font-weight:900;

  letter-spacing:3px;

  text-anchor:middle;
}

.dial-percent{
  fill:#8290a3;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:13px;
  font-weight:900;

  text-anchor:middle;
}

/* =========================
   目盛り
========================= */

.scale-line{
  stroke:#52647b;

  stroke-width:2;
  stroke-linecap:round;

  pointer-events:none;
}

.scale-line.major{
  stroke:#94a4b6;
  stroke-width:4;
}

.scale-label{
  fill:#aebccc;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:12px;
  font-weight:900;

  text-anchor:middle;

  pointer-events:none;
}

/* =========================
   操作ノブ
========================= */

.dial-handle{
  fill:#030609;

  stroke:var(--green);
  stroke-width:6;

  pointer-events:none;
}

.handle-center{
  fill:var(--green);

  pointer-events:none;
}

.handle-line{
  stroke:#030609;

  stroke-width:2;
  stroke-linecap:round;

  pointer-events:none;
}

/* =========================
   横長の進化ボタン
========================= */

.evolution-button{
  width:min(205px,70%);
  height:44px;

  margin:2px auto 0;

  padding:0 18px;

  display:none;
  align-items:center;
  justify-content:center;

  justify-self:center;
  align-self:center;

  background:#00ad54;
  color:#ffffff;

  border:3px solid #b6ffd0;
  border-radius:8px;

  box-shadow:
    0 3px 0 #056b34,
    0 5px 10px rgba(0,0,0,.36);

  font-size:21px;
  font-weight:950;

  cursor:pointer;

  touch-action:manipulation;
}

.evolution-button.show{
  display:flex;
}

.evolution-button:active{
  transform:
    translateY(2px)
    scale(.98);

  box-shadow:
    0 1px 0 #056b34;
}

.evolution-button:disabled{
  display:none;
}

/* =========================
   操作説明
========================= */

.dial-guide{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 4px;

  color:#718198;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:8px;
  font-weight:900;

  text-align:center;

  white-space:nowrap;
}

/* =========================
   下部表示
========================= */

.limit-indicator{
  width:100%;

  padding:2px 6px 0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-top:1px solid #26374d;

  color:#63738a;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:7px;
  font-weight:900;
}

.limit-indicator strong{
  color:#b7c4d4;
}

/* =========================
   進化演出
========================= */

.evolution-overlay{
  position:absolute;
  inset:0;

  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:rgba(1,6,8,.68);

  pointer-events:none;
}

.evolution-overlay.active{
  display:flex;

  animation:
    evolutionBackground
    1.5s ease both;
}

.evolution-flash{
  position:absolute;

  width:40px;
  height:40px;

  border:6px solid #ffffff;
  border-radius:50%;

  opacity:0;
}

.evolution-overlay.active .evolution-flash{
  animation:
    evolutionRing
    1.35s ease-out both;
}

.evolution-flash.second{
  animation-delay:.18s !important;
}

.evolution-flash.third{
  animation-delay:.36s !important;
}

.evolution-text{
  position:relative;
  z-index:4;

  padding:12px 22px;

  color:#ffffff;

  font-family:
    "Courier New",
    ui-monospace,
    monospace;

  font-size:clamp(25px,7vw,42px);
  font-weight:950;

  letter-spacing:3px;

  text-align:center;

  opacity:0;

  text-shadow:
    0 2px 0 #087a39,
    0 0 12px #22c55e;
}

.evolution-overlay.active .evolution-text{
  animation:
    evolutionText
    1.5s ease both;
}

.digital-unit.evolving{
  animation:
    monitorEvolution
    1.5s ease;
}

.digital-unit.evolving .dial-progress{
  animation:
    gaugeEvolution
    1.5s ease;
}

.digital-unit.evolving .dial-hp-value{
  animation:
    numberEvolution
    1.5s ease;
}

@keyframes evolutionBackground{
  0%{
    background:rgba(1,6,8,0);
  }

  25%{
    background:rgba(1,15,8,.78);
  }

  65%{
    background:rgba(4,35,17,.82);
  }

  100%{
    background:rgba(1,6,8,0);
  }
}

@keyframes evolutionRing{
  0%{
    width:30px;
    height:30px;

    opacity:0;
  }

  15%{
    opacity:1;
  }

  70%{
    opacity:.8;

    border-color:#22c55e;
  }

  100%{
    width:650px;
    height:650px;

    opacity:0;

    border-width:2px;
  }
}

@keyframes evolutionText{
  0%{
    opacity:0;

    transform:scale(.55);

    filter:blur(8px);
  }

  30%{
    opacity:1;

    transform:scale(1.15);

    filter:blur(0);
  }

  65%{
    opacity:1;

    transform:scale(1);
  }

  100%{
    opacity:0;

    transform:scale(1.06);
  }
}

@keyframes monitorEvolution{
  0%{
    border-color:#29364a;
  }

  25%{
    border-color:#ffffff;
  }

  50%{
    border-color:#22c55e;

    box-shadow:
      inset 0 0 30px rgba(34,197,94,.35),
      0 0 24px rgba(34,197,94,.7);
  }

  100%{
    border-color:#29364a;
  }
}

@keyframes gaugeEvolution{
  0%{
    opacity:1;
  }

  20%{
    opacity:.15;

    stroke:#ffffff;
  }

  40%{
    opacity:1;

    stroke:#22c55e;
  }

  60%{
    opacity:.25;
  }

  100%{
    opacity:1;
  }
}

@keyframes numberEvolution{
  0%{
    opacity:1;

    transform:scale(1);

    transform-origin:center;
  }

  25%{
    opacity:0;

    transform:scale(.55);
  }

  55%{
    opacity:1;

    transform:scale(1.2);
  }

  100%{
    opacity:1;

    transform:scale(1);
  }
}

/* =========================
   高さ820px以下
========================= */

@media(max-height:820px){

  .digital-unit{
    grid-template-rows:
      16px
      150px
      minmax(0,1fr)
      43px
      15px
      17px;
  }

  .character-section{
    padding:5px 12px 3px;
  }

  .character-frame{
    max-width:150px;
  }

  .attribute-panel{
    gap:13px;
  }

  .attribute-icon-frame{
    width:47px;
    height:47px;
  }

  .attribute-row{
    grid-template-columns:minmax(0,1fr) 47px;
  }

  .dial-area{
    width:min(
      86vw,
      calc(var(--app-height) - 350px),
      340px
    );
  }

  .evolution-button{
    height:41px;

    font-size:19px;
  }
}

/* =========================
   高さ700px以下
========================= */

@media(max-height:700px){

  .top-control{
    height:44px;
    flex-basis:44px;
  }

  .pokemon-select,
  .reset{
    height:44px;
  }

  .digital-unit{
    grid-template-rows:
      15px
      120px
      minmax(0,1fr)
      39px
      0
      16px;
  }

  .character-section{
    gap:10px;

    padding:3px 9px;
  }

  .character-frame{
    max-width:118px;
  }

  .attribute-panel{
    gap:8px;
  }

  .attribute-label{
    font-size:13px;
  }

  .attribute-icon-frame{
    width:40px;
    height:40px;
  }

  .attribute-row{
    grid-template-columns:minmax(0,1fr) 40px;

    gap:5px;
  }

  .dial-area{
    width:min(
      82vw,
      calc(var(--app-height) - 275px),
      300px
    );
  }

  .evolution-button{
    height:38px;

    font-size:17px;
  }

  .dial-guide{
    display:none;
  }
}

/* =========================
   高さ590px以下
========================= */

@media(max-height:590px){

  .digital-unit{
    grid-template-rows:
      14px
      96px
      minmax(0,1fr)
      35px
      0
      15px;
  }

  .character-frame{
    max-width:94px;
  }

  .attribute-label{
    font-size:11px;
  }

  .attribute-icon-frame{
    width:34px;
    height:34px;
  }

  .attribute-row{
    grid-template-columns:minmax(0,1fr) 34px;
  }

  .dial-area{
    width:min(
      78vw,
      calc(var(--app-height) - 230px),
      240px
    );
  }

  .evolution-button{
    height:34px;

    font-size:15px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top-control">

    <div class="select-frame">

      <select
        id="pokemonSelect"
        class="pokemon-select"
        aria-label="ポケモンを選択"
      >
        <option value="">
          ポケモンを選択
        </option>
      </select>

    </div>

    <button
      id="resetBtn"
      class="reset"
      type="button"
    >
      RESET
    </button>

  </div>

  <main class="card">

    <section
      id="digitalUnit"
      class="digital-unit"
    >

      <div class="digital-header">

        <span id="monitorName">
          LIFE MONITOR
        </span>

        <span class="status-area">
          <span class="status-light"></span>
          ACTIVE
        </span>

      </div>

      <!-- キャラクター情報 -->

      <div class="character-section">

        <div class="character-frame">

          <img
            id="characterImage"
            class="character-image is-hidden"
            src=""
            alt=""
          >

          <div
            id="characterPlaceholder"
            class="character-placeholder"
          >
            ポケモンを<br>
            選択してください
          </div>

        </div>

        <div class="attribute-panel">

          <div class="attribute-row">

            <div class="attribute-label">
              TYPE：
            </div>

            <div class="attribute-icon-frame">

              <img
                id="typeIcon"
                class="attribute-icon is-hidden"
                src=""
                alt=""
              >

              <div
                id="typeFallback"
                class="attribute-fallback"
              >
                ？
              </div>

            </div>

          </div>

          <div class="attribute-row">

            <div class="attribute-label">
              WEAKNESS：
            </div>

            <div class="attribute-icon-frame">

              <img
                id="weaknessIcon"

/* =========================
   PWA表示高さ
========================= */

function isStandaloneMode(){

  return (
    window.navigator.standalone === true ||
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches
  );
}

function updateAppHeight(){

  let height =
    window.innerHeight;

  if(
    window.visualViewport &&
    Number.isFinite(
      window.visualViewport.height
    )
  ){
    height =
      window.visualViewport.height;
  }

  const safeMargin =
    isStandaloneMode()
      ? 4
      : 10;

  height =
    Math.floor(height) -
    safeMargin;

  height =
    Math.max(
      480,
      height
    );

  document.documentElement.style.setProperty(
    "--app-height",
    height + "px"
  );
}

updateAppHeight();

window.addEventListener(
  "resize",
  updateAppHeight
);

window.addEventListener(
  "orientationchange",
  () => {

    updateAppHeight();

    window.setTimeout(
      updateAppHeight,
      100
    );

    window.setTimeout(
      updateAppHeight,
      350
    );
  }
);

if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    updateAppHeight
  );

  window.visualViewport.addEventListener(
    "scroll",
    updateAppHeight
  );
}

function showImageOrFallback(
  imageElement,
  fallbackElement,
  source,
  alt,
  fallbackText
){

  imageElement.onload = () => {

    imageElement.classList.remove(
      "is-hidden"
    );

    fallbackElement.classList.add(
      "is-hidden"
    );
  };

  imageElement.onerror = () => {

    imageElement.classList.add(
      "is-hidden"
    );

    fallbackElement.classList.remove(
      "is-hidden"
    );

    fallbackElement.textContent =
      fallbackText;
  };

  imageElement.alt =
    alt || "";

  if(source){

    imageElement.src =
      source;

  }else{

    imageElement.removeAttribute(
      "src"
    );

    imageElement.classList.add(
      "is-hidden"
    );

    fallbackElement.classList.remove(
      "is-hidden"
    );

    fallbackElement.textContent =
      fallbackText;
  }
}

function renderPokemonInformation(){

  const stage =
    getCurrentStageData();

  if(!stage){

    characterImage.removeAttribute(
      "src"
    );

    characterImage.classList.add(
      "is-hidden"

    characterPlaceholder.classList.remove(
      "is-hidden"

    characterPlaceholder.innerHTML =

    typeIcon.removeAttribute(
      "src"
    );

    typeIcon.classList.add(
      "is-hidden"
    );

    typeFallback.classList.remove(
      "is-hidden"
    );

    typeFallback.textContent =
      "？";

    weaknessIcon.removeAttribute(
      "src"
    );

    weaknessIcon.classList.add(
      "is-hidden"
    );

    weaknessFallback.classList.remove(
      "is-hidden"
    );

    weaknessFallback.textContent =
      "？";

    return;
  }

  showImageOrFallback(
    characterImage,
    characterPlaceholder,
    stage.image,
    stage.name,
    "画像未登録"
  );

  showImageOrFallback(
    typeIcon,
    typeFallback,

    stage.typeName,
    stage.typeFallback

  showImageOrFallback(
    weaknessIcon,

    stage.weaknessIcon,

}

/* =========================
   円計算
========================= */

function polarToCartesian(
  centerX,
  centerY,
  radius,
  angle
){

  const radians =
    angle * Math.PI / 180;

  return {
    x:
      centerX +
      radius * Math.cos(radians),

    y:
      centerY +
      radius * Math.sin(radians)
  };
}

function getDegreesPerStep(){

  return 360 /
    (maxHp / HP_STEP);
}

function hpToAngle(value){

  return -90 +
    (value / maxHp) * 360;
}

function getHpColor(){

  if(hp <= 40){
    return "#ff334f";
  }

  if(hp <= 80){
    return "#ffd400";
  }

  return "#00d98b";
}

/* =========================
   目盛り生成
========================= */

function createDialScale(){

  scaleLines.innerHTML = "";
  scaleLabels.innerHTML = "";

  for(
    let value = 0;
    value < maxHp;
    value += HP_STEP
  ){

    const angle =
      -90 +
      (value / maxHp) *
      360;

    const isMajor =
      value % 30 === 0;

    const innerRadius =
      isMajor
        ? SCALE_INNER_RADIUS - 6
        : SCALE_INNER_RADIUS;

    const start =
      polarToCartesian(
        CENTER_X,
        CENTER_Y,
        innerRadius,
        angle
      );

    const end =
      polarToCartesian(
        CENTER_X,
        CENTER_Y,
        SCALE_OUTER_RADIUS,
        angle
      );

    const line =
      document.createElementNS(
        SVG_NAMESPACE,
        "line"
      );

    line.setAttribute(
      "x1",
      start.x
    );

    line.setAttribute(
      "y1",
      start.y
    );

    line.setAttribute(
      "x2",
      end.x
    );

    line.setAttribute(
      "y2",
      end.y
    );

    line.setAttribute(
      "class",
      isMajor
        ? "scale-line major"
        : "scale-line"
    );

    scaleLines.appendChild(
      line
    );

    if(isMajor){

      const position =
        polarToCartesian(
          CENTER_X,
          CENTER_Y,
          LABEL_RADIUS,
          angle
        );

      const text =
        document.createElementNS(
          SVG_NAMESPACE,
          "text"
        );

      text.setAttribute(
        "x",
        position.x
      );

      text.setAttribute(
        "y",
        position.y + 4
      );

      text.setAttribute(
        "class",
        "scale-label"
      );

      text.textContent =
        value === 0
          ? "0/" + maxHp
          : value;

      scaleLabels.appendChild(
        text
      );
    }
  }
}

/* =========================
   HP描画
========================= */

function renderHP(){

  hp =
    Math.max(
      MIN_HP,
      Math.min(
        maxHp,
        hp
      )
    );

  const ratio =
    hp / maxHp;

  const color =
    getHpColor();

  const dashOffset =
    CIRCUMFERENCE *
    (1 - ratio);

  const angle =
    hpToAngle(hp);

  const position =
    polarToCartesian(
      CENTER_X,
      CENTER_Y,
      HANDLE_RADIUS,
      angle
    );

  hpValueEl.textContent =
    String(hp).padStart(
      3,
      "0"
    );

  hpPercentEl.textContent =
    Math.round(
      ratio * 100
    ) + "%";

  maxHpLabel.textContent =
    maxHp;

  dialContainer.setAttribute(
    "aria-valuemax",
    maxHp
  );

  dialContainer.setAttribute(
    "aria-valuenow",
    hp
  );

  dialContainer.setAttribute(
    "aria-valuetext",
    "HP " +
    hp +
    "、最大HP " +
    maxHp
  );

  dialProgress.style.strokeDasharray =
    CIRCUMFERENCE;

  dialProgress.style.strokeDashoffset =
    dashOffset;

  dialProgress.style.stroke =
    color;

  hpValueEl.style.fill =
    color;

  dialHandle.style.stroke =
    color;

  handleCenter.style.fill =
    color;

  dialHandle.setAttribute(
    "cx",
    position.x
  );

  dialHandle.setAttribute(
    "cy",
    position.y
  );

  handleCenter.setAttribute(
    "cx",
    position.x
  );

  handleCenter.setAttribute(
    "cy",
    position.y
  );

  const inner =
    polarToCartesian(
      CENTER_X,
      CENTER_Y,
      HANDLE_RADIUS - 4,
      angle
    );

  const outer =
    polarToCartesian(
      CENTER_X,
      CENTER_Y,
      HANDLE_RADIUS + 4,
      angle
    );

  handleLine.setAttribute(
    "x1",
    inner.x
  );

  handleLine.setAttribute(
    "y1",
    inner.y
  );

  handleLine.setAttribute(
    "x2",
    outer.x
  );

  handleLine.setAttribute(
    "y2",
    outer.y
  );
}

/* =========================
   進化ボタン
========================= */

function renderEvolutionButton(){

  const show =
    hasNextEvolution() &&
    !isEvolving;

  evolutionButton.classList.toggle(
    "show",
    show
  );

  evolutionButton.disabled =
    !show;
}

/* =========================
   全体描画
========================= */

function renderAll(){

  const stage =
    getCurrentStageData();

  if(stage){

    maxHp =
      stage.maxHp;
  }

  createDialScale();
  renderHP();
  renderPokemonInformation();
  updateSelectedOptionText();
  renderEvolutionButton();

  monitorName.textContent =
    stage
      ? stage.name
      : "LIFE MONITOR";
}

/* =========================
   ポインター座標
========================= */

function getPointerPosition(event){

  const rect =
    hpDial.getBoundingClientRect();

  return {
    x:
      (
        event.clientX -
        rect.left
      ) *
      (360 / rect.width),

    y:
      (
        event.clientY -
        rect.top
      ) *
      (360 / rect.height)
  };
}

function getPointerAngle(event){

  const point =
    getPointerPosition(event);

  return Math.atan2(
    point.y - CENTER_Y,
    point.x - CENTER_X
  ) *
  180 /
  Math.PI;
}

/* =========================
   タップ移動
========================= */

function jumpToTappedHp(event){

  if(isEvolving){
    return;
  }

  const point =
    getPointerPosition(event);

  const dx =
    point.x - CENTER_X;

  const dy =
    point.y - CENTER_Y;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if(
    distance <
      DIAL_RADIUS - 45 ||
    distance >
      DIAL_RADIUS + 45
  ){
    return;
  }

  const angle =
    Math.atan2(
      dy,
      dx
    ) *
    180 /
    Math.PI;

  let clockwiseAngle =
    angle + 90;

  if(clockwiseAngle < 0){
    clockwiseAngle += 360;
  }

  if(clockwiseAngle >= 360){
    clockwiseAngle -= 360;
  }

  const stepAngle =
    getDegreesPerStep();

  let step =
    Math.round(
      clockwiseAngle /
      stepAngle
    );

  const totalSteps =
    maxHp / HP_STEP;

  if(step >= totalSteps){
    step = 0;
  }

  let nextHp =
    step * HP_STEP;

  if(step === 0){

    nextHp =
      hp >= maxHp / 2
        ? maxHp
        : 0;
  }

  hp =
    nextHp;

  accumulatedAngle =
    0;

  previousPointerAngle =
    null;

  renderHP();
}

/* =========================
   ドラッグ
========================= */

function updateHpFromDrag(event){

  if(isEvolving){
    return;
  }

  const currentAngle =
    getPointerAngle(event);

  if(
    previousPointerAngle ===
    null
  ){

    previousPointerAngle =
      currentAngle;

    return;
  }

  let difference =
    currentAngle -
    previousPointerAngle;

  if(difference > 180){
    difference -= 360;
  }

  if(difference < -180){
    difference += 360;
  }

  accumulatedAngle +=
    difference;

  const stepAngle =
    getDegreesPerStep();

  while(
    accumulatedAngle >=
    stepAngle
  ){

    if(hp < maxHp){

      hp =
        Math.min(
          maxHp,
          hp + HP_STEP
        );

      renderHP();
    }

    accumulatedAngle -=
      stepAngle;
  }

  while(
    accumulatedAngle <=
    -stepAngle
  ){

    if(hp > MIN_HP){

      hp =
        Math.max(
          MIN_HP,
          hp - HP_STEP
        );

      renderHP();
    }

    accumulatedAngle +=
      stepAngle;
  }

  if(
    hp === maxHp &&
    accumulatedAngle > 0
  ){

    accumulatedAngle =
      0;
  }

  if(
    hp === MIN_HP &&
    accumulatedAngle < 0
  ){

    accumulatedAngle =
      0;
  }

  previousPointerAngle =
    currentAngle;
}

/* =========================
   ダイヤル操作
========================= */

dialContainer.addEventListener(
  "pointerdown",
  event => {

    if(isEvolving){
      return;
    }

    event.preventDefault();

    isDragging = true;
    pointerMoved = false;

    pointerStartX =
      event.clientX;

    pointerStartY =
      event.clientY;

    previousPointerAngle =
      getPointerAngle(event);

    accumulatedAngle = 0;

    dialContainer.classList.add(
      "dragging"
    );

    try{

      dialContainer.setPointerCapture(
        event.pointerId
      );

    }catch(error){}
  }
);

dialContainer.addEventListener(
  "pointermove",
  event => {

    if(
      !isDragging ||
      isEvolving
    ){
      return;
    }

    event.preventDefault();

    const dx =
      event.clientX -
      pointerStartX;

    const dy =
      event.clientY -
      pointerStartY;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if(
      distance >=
      TAP_MOVE_THRESHOLD
    ){

      pointerMoved =
        true;
    }

    if(pointerMoved){

      updateHpFromDrag(
        event
      );
    }
  },
  {
    passive:false
  }
);

function finishPointer(
  event,
  allowTap
){

  if(
    isDragging &&
    allowTap &&
    !pointerMoved &&
    !isEvolving
  ){

    jumpToTappedHp(
      event
    );
  }

  isDragging =
    false;

  pointerMoved =
    false;

  previousPointerAngle =
    null;

  accumulatedAngle =
    0;

  dialContainer.classList.remove(
    "dragging"
  );

  try{

    if(
      dialContainer.hasPointerCapture(
        event.pointerId
      )
    ){

      dialContainer.releasePointerCapture(
        event.pointerId
      );
    }

  }catch(error){}
}

dialContainer.addEventListener(
  "pointerup",
  event => {

    finishPointer(
      event,
      true
    );
  }
);

dialContainer.addEventListener(
  "pointercancel",
  event => {

    finishPointer(
      event,
      false
    );
  }
);

dialContainer.addEventListener(
  "touchmove",
  event => {

    event.preventDefault();
  },
  {
    passive:false
  }
);

/* =========================
   キーボード
========================= */

dialContainer.addEventListener(
  "keydown",
  event => {

    if(isEvolving){
      return;
    }

    if(
      event.key === "ArrowLeft" ||
      event.key === "ArrowDown"
    ){

      event.preventDefault();

      hp =
        Math.max(
          MIN_HP,
          hp - HP_STEP
        );

      renderHP();
    }

    if(
      event.key === "ArrowRight" ||
      event.key === "ArrowUp"
    ){

      event.preventDefault();

      hp =
        Math.min(
          maxHp,
          hp + HP_STEP
        );

      renderHP();
    }
  }
);

/* =========================
   ポケモン変更
========================= */

pokemonSelect.addEventListener(
  "change",
  () => {

    if(isEvolving){
      return;
    }

    restoreOptionNames();

    selectedBasePokemon =
      pokemonSelect.value;

    evolutionStage =
      0;

    const stage =
      getCurrentStageData();

    maxHp =
      stage
        ? stage.maxHp
        : BASE_MAX_HP;

    hp =
      maxHp;

    isDragging =
      false;

    pointerMoved =
      false;

    previousPointerAngle =
      null;

    accumulatedAngle =
      0;

    renderAll();
  }
);

/* =========================
   進化
========================= */

evolutionButton.addEventListener(
  "pointerdown",
  event => {

    event.stopPropagation();
  }
);

evolutionButton.addEventListener(
  "pointerup",
  event => {

    event.stopPropagation();
  }
);

evolutionButton.addEventListener(
  "click",
  event => {

    event.preventDefault();
    event.stopPropagation();

    if(
      isEvolving ||
      !hasNextEvolution()
    ){
      return;
    }

    const pokemon =
      getSelectedPokemon();

    const nextStage =
      evolutionStage + 1;

    const next =
      pokemon.stages[
        nextStage
      ];

    const damage =
      maxHp - hp;

    isEvolving =
      true;

    isDragging =
      false;

    pointerMoved =
      false;

    previousPointerAngle =
      null;

    accumulatedAngle =
      0;

    evolutionButton.disabled =
      true;

    evolutionButton.classList.remove(
      "show"
    );

    evolutionText.textContent =
      "EVOLUTION";

    evolutionOverlay.classList.add(
      "active"
    );

    digitalUnit.classList.add(
      "evolving"
    );

    window.setTimeout(
      () => {

        evolutionStage =
          nextStage;

        maxHp =
          next.maxHp;

        hp =
          Math.max(
            MIN_HP,
            maxHp - damage
          );

        updateSelectedOptionText();
        renderPokemonInformation();
        createDialScale();
        renderHP();

        monitorName.textContent =
          next.name;

        evolutionText.textContent =
          next.name;
      },
      650
    );

    window.setTimeout(
      () => {

        evolutionOverlay.classList.remove(
          "active"
        );

        digitalUnit.classList.remove(
          "evolving"
        );

        isEvolving =
          false;

        renderEvolutionButton();
      },
      1550
    );
  }
);

/* =========================
   RESET
========================= */

resetBtn.addEventListener(
  "click",
  () => {

    if(isEvolving){
      return;
    }

    evolutionStage =
      0;

    const stage =
      getCurrentStageData();

    maxHp =
      stage
        ? stage.maxHp
        : BASE_MAX_HP;

    hp =
      maxHp;

    isDragging =
      false;

    pointerMoved =
      false;

    previousPointerAngle =
      null;

    accumulatedAngle =
      0;

    restoreOptionNames();

    renderAll();
  }
);

/* =========================
   Service Worker
========================= */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(error => {

          console.error(
            "Service Worker registration failed:",
            error
          );
        });
    }
  );
}

/* =========================
   スクロール防止
========================= */

document.addEventListener(
  "touchmove",
  event => {

    if(
      event.target.closest(
        ".dial-container"
      )
    ){

      event.preventDefault();
    }
  },
  {
    passive:false
  }
);

/* =========================
   起動
========================= */

updateAppHeight();
renderAll();
</script>
