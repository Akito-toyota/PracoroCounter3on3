nd:var(--monitor);border:1px solid #29364a;border-radius:9px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}.unit.active{border:3px solid var(--orange);background:#171208}.badge{display:none;position:absolute;top:2px;left:2px;z-index:5;background:var(--orange);color:#211403;border-radius:4px;padding:2px 4px;font-size:8px;font-weight:950}.unit.active .badge{display:block}.pick{height:30px;width:100%;font-size:10px}.monname{height:28px;width:100%;border:0;background:transparent;color:#fff;font-size:clamp(10px,1.6vw,16px);font-weight:950;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.avatar{height:70px;width:100%;display:flex;align-items:center;justify-content:center}.avatar img{height:100%;max-width:100%;object-fit:contain;image-rendering:pixelated}.dial{flex:1;min-height:0;width:100%;aspect-ratio:1;touch-action:none}.dial svg{width:100%;height:100%;display:block}.case{fill:#030609;stroke:#263b56;stroke-width:5}.detail{fill:none;stroke:#101a28;stroke-width:10}.track{fill:none;stroke:#1d2938;stroke-width:24}.progress{fill:none;stroke:var(--green);stroke-width:24;transform:rotate(-90deg);transform-origin:180px 180px}.center{fill:#030609;stroke:#293e59;stroke-width:4}.inner{fill:#050a10;stroke:#16263a;stroke-width:2}.hpnum{font:950 76px "Courier New";text-anchor:middle;fill:var(--green)}.hplabel,.pct,.life{font-family:"Courier New";font-weight:900;text-anchor:middle;fill:#718198}.hplabel{font-size:17px}.life{font-size:10px}.pct{font-size:12px}.scale{stroke:#52647b;stroke-width:2}.scale.major{stroke:#94a4b6;stroke-width:4}.handle{fill:#030609;stroke:var(--green);stroke-width:6}.handleDot{fill:var(--green)}.miniEvolve{position:absolute;right:4px;bottom:4px;width:42px;height:29px;border-radius:6px;border:2px solid #86efac;background:#16a34a;color:#fff;font-size:10px;font-weight:950}.miniReset{position:absolute;left:4px;bottom:4px;height:22px;border:1px solid #3a4656;border-radius:5px;background:#171f2b;color:#fff;font-size:8px;font-weight:900}.empty{margin:auto;color:#536174;font-size:10px;font-weight:900}.footer{height:16px;text-align:center;color:#66758a;font:900 8px "Courier New"}

.switchArea{width:100%;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;border-radius:7px;cursor:pointer;touch-action:manipulation;position:relative}.switchArea:active{background:rgba(245,158,11,.14)}.switchArea:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}.unit.active .switchArea{background:rgba(245,158,11,.07)}
.meta{height:30px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:1px 2px}.metaItem{min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;color:#aebccc;font:900 7px "Courier New"}.metaItem img{width:22px;height:22px;object-fit:contain;border-radius:3px}.metaFallback{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid #304057;border-radius:3px;background:#111827;font-size:13px}.evoOverlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;overflow:hidden;background:rgba(1,6,8,.72);pointer-events:none}.evoOverlay.active{display:flex;animation:evoBg 1.5s ease both}.evoRing{position:absolute;width:20px;height:20px;border:4px solid #fff;border-radius:50%;animation:evoRing 1.35s ease-out both}.evoRing.r2{animation-delay:.18s}.evoRing.r3{animation-delay:.36s}.evoText{z-index:2;color:#fff;font:950 clamp(12px,2vw,20px) "Courier New";text-shadow:0 2px 0 #087a39,0 0 10px #22c55e;animation:evoText 1.5s ease both}.unit.evolving{animation:evoUnit 1.5s ease}.unit.evolving .progress{animation:evoGauge 1.5s ease}.unit.evolving .hpnum{animation:evoNum 1.5s ease}@keyframes evoBg{0%,100%{background:rgba(1,6,8,0)}35%{background:rgba(1,23,11,.85)}65%{background:rgba(4,45,21,.88)}}@keyframes evoRing{0%{width:20px;height:20px;opacity:0}20%{opacity:1}100%{width:360px;height:360px;opacity:0;border-width:1px}}@keyframes evoText{0%{opacity:0;transform:scale(.5);filter:blur(7px)}35%{opacity:1;transform:scale(1.12);filter:blur(0)}70%{opacity:1}100%{opacity:0;transform:scale(1.04)}}@keyframes evoUnit{0%,100%{border-color:#29364a}35%{border-color:#fff}60%{border-color:#22c55e;box-shadow:inset 0 0 20px rgba(34,197,94,.4),0 0 15px rgba(34,197,94,.65)}}@keyframes evoGauge{20%{opacity:.15;stroke:#fff}45%{opacity:1;stroke:#22c55e}70%{opacity:.3}}@keyframes evoNum{25%{opacity:0;transform:scale(.6);transform-origin:center}60%{opacity:1;transform:scale(1.15);transform-origin:center}}

<body>
<div class="app">
  <div class="top">
    <select id="mode" class="mode" aria-label="3on3モード"><option value="random">3on3 ランダム対戦</option><option value="free">3on3 フリー対戦</option></select>
    <button id="allReset" class="btn resetAll" type="button">RESET</button>
  </div>
  <div class="controls"><button id="draw" class="btn draw" type="button">くじを引く</button><button id="redraw" class="btn" type="button">引き直す</button></div>
  <div id="status" class="status"></div>
  <main class="battle">
    <section class="side" data-player="0"><div class="sidehead"><input class="name playerName" value="PLAYER 1" aria-label="プレイヤー1名"><button class="btn sideReset" type="button">RESET</button></div><div class="team"></div></section>
    <section class="side p2" data-player="1"><div class="sidehead"><input class="name playerName" value="PLAYER 2" aria-label="プレイヤー2名"><button class="btn sideReset" type="button">RESET</button></div><div class="team"></div></section>
  </main>
  <div class="footer">名前をタップして対戦中ポケモンを切替 ／ RINGをドラッグ</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
function stage(name,maxHp,image){return{name,maxHp,image}}
const pokemonMaster={
"ピカチュウ":{stages:[stage("ピカチュウ",120,"./characters/pikacyu.png")]},
"ヒトカゲ":{stages:[stage("ヒトカゲ",120,"./characters/hitokage.png"),stage("リザード",150,"./characters/lizardo.png"),stage("リザードン",180,"./characters/lizardon.png")]},
"フシギダネ":{stages:[stage("フシギダネ",120,"./characters/fushigidane.png"),stage("フシギソウ",150,"./characters/fushigisou.png"),stage("フシギバナ",180,"./characters/fushigibana.png")]},
"ゼニガメ":{stages:[stage("ゼニガメ",120,"./characters/zenigame.png"),stage("カメール",150,"./characters/kameil.png"),stage("カメックス",180,"./characters/kamex.png")]},
"ミュウ":{stages:[stage("ミュウ",120,"./characters/myu.png")]},"イーブイ":{stages:[stage("イーブイ",120,"./characters/ibui.png")]},"ルカリオ":{stages:[stage("ルカリオ",120,"./characters/rukario.png")]},"メタグロス":{stages:[stage("メタグロス",120,"./characters/metagurosu.png")]},"ゲンガー":{stages:[stage("ゲンガー",120,"./characters/genga.png")]},"イワーク":{stages:[stage("イワーク",120,"./characters/iwaku.png")]},"ベトベター":{stages:[stage("ベトベター",120,"./characters/betobeta.png")]},"カイロス":{stages:[stage("カイロス",120,"./characters/kairosu.png")]},"ファイヤー":{stages:[stage("ファイヤー",120,"./characters/faiya.png")]},"サンダー":{stages:[stage("サンダー",120,"./characters/sanda.png")]},"フリーザー":{stages:[stage("フリーザー",120,"./characters/furiza.png")]},"ヤミラミ":{stages:[stage("ヤミラミ",120,"./characters/yamirami.png")]},"ゲッコウガ":{stages:[stage("ゲッコウガ",120,"./characters/gekkouga.png")]},"ボスゴドラ":{stages:[stage("ボスゴドラ",120,"./characters/bosugodora.png")]},"レックウザ":{stages:[stage("レックウザ",120,"./characters/rekkuuza.png")]},"カヌチャン":{stages:[stage("カヌチャン",120,"./characters/kanucyan.png")]},"ラッキー":{stages:[stage("ラッキー",120,"./characters/rakki.png")]},"カイリュー":{stages:[stage("カイリュー",120,"./characters/kairyu.png")]},"チルタリス":{stages:[stage("チルタリス",120,"./characters/chirutarisu.png")]}
};
const attributeMaster={
"ピカチュウ":["./types/electric.png","⚡","./types/fighting.png","✊"],"ヒトカゲ":["./types/fire.png","🔥","./types/water.png","💧"],"フシギダネ":["./types/grass.png","🌿","./types/fire.png","🔥"],"ゼニガメ":["./types/water.png","💧","./types/electric.png","⚡"],"ミュウ":["./types/psychic.png","🔮","./types/dark.png","🌑"],"イーブイ":["./types/normal.png","★","./types/fighting.png","✊"],"ルカリオ":["./types/fighting.png","✊","./types/fire.png","🔥"],"メタグロス":["./types/steel.png","⚙","./types/fire.png","🔥"],"ゲンガー":["./types/dark.png","🌑","./types/psychic.png","🔮"],"イワーク":["./types/fighting.png","✊","./types/grass.png","🌿"],"ベトベター":["./types/dark.png","🌑","./types/fighting.png","✊"],"カイロス":["./types/grass.png","🌿","./types/flying.png","🪽"],"ファイヤー":["./types/fire.png","🔥","./types/water.png","💧"],"サンダー":["./types/electric.png","⚡","./types/fighting.png","✊"],"フリーザー":["./types/water.png","💧","./types/steel.png","⚙"],"ヤミラミ":["./types/dark.png","🌑","./types/psychic.png","🔮"],"ゲッコウガ":["./types/water.png","💧","./types/grass.png","🌿"],"ボスゴドラ":["./types/steel.png","⚙","./types/fighting.png","✊"],"レックウザ":["./types/dragon.png","🐉","./types/dragon.png","🐉"],"カヌチャン":["./types/psychic.png","🔮","./types/fire.png","🔥"],"ラッキー":["./types/normal.png","★","./types/fighting.png","✊"],"カイリュー":["./types/dragon.png","🐉","./types/dragon.png","🐉"],"チルタリス":["./types/flying.png","🪽","./types/water.png","💧"]};
function iconHtml(src,fallback,label){return `<span class="metaItem"><span>${label}</span><span class="metaFallback">${fallback}</span><img src="${src}" alt="${label}" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"></span>`}
const names=Object.keys(pokemonMaster),R=137,C=2*Math.PI*R;
function monster(base){return base?{base,stage:0,hp:120,maxHp:120,drag:false,moved:false,last:null,acc:0,sx:0,sy:0}:null}function cur(m){return m?pokemonMaster[m.base].stages[m.stage]:null}function canEvolve(m){return m&&m.stage<pokemonMaster[m.base].stages.length-1}function color(h){return h<=40?'#ff334f':h<=80?'#ffd400':'#00d98b'}function p2c(rad,a){const q=a*Math.PI/180;return{x:180+rad*Math.cos(q),y:180+rad*Math.sin(q)}}
function dialMarkup(){return `<svg viewBox="0 0 360 360"><circle class="case" cx="180" cy="180" r="167"/><circle class="detail" cx="180" cy="180" r="153"/><circle class="track" cx="180" cy="180" r="137"/><circle class="progress" cx="180" cy="180" r="137"/><g class="scales"></g><circle class="center" cx="180" cy="180" r="96"/><circle class="inner" cx="180" cy="180" r="87"/><text class="hplabel" x="180" y="140">HP</text><text class="hpnum" x="180" y="218">120</text><text class="life" x="180" y="243">LIFE POINT</text><text class="pct" x="180" y="268">100%</text><circle class="handle" cx="180" cy="43" r="16"/><circle class="handleDot" cx="180" cy="43" r="6"/></svg>`}
function renderDial(el,m){const ratio=m.hp/m.maxHp,col=color(m.hp),a=-90+ratio*360,pos=p2c(R,a),pr=el.querySelector('.progress'),num=el.querySelector('.hpnum'),pct=el.querySelector('.pct'),h=el.querySelector('.handle'),hd=el.querySelector('.handleDot'),g=el.querySelector('.scales');pr.style.strokeDasharray=C;pr.style.strokeDashoffset=C*(1-ratio);pr.style.stroke=col;num.textContent=String(m.hp).padStart(3,'0');num.style.fill=col;pct.textContent=Math.round(ratio*100)+'%';h.style.stroke=col;hd.style.fill=col;for(const n of [h,hd]){n.setAttribute('cx',pos.x);n.setAttribute('cy',pos.y)}g.innerHTML='';for(let v=0;v<m.maxHp;v+=10){const an=-90+v/m.maxHp*360,s=p2c(v%30===0?147:153,an),e=p2c(161,an),ln=document.createElementNS(NS,'line');ln.setAttribute('x1',s.x);ln.setAttribute('y1',s.y);ln.setAttribute('x2',e.x);ln.setAttribute('y2',e.y);ln.setAttribute('class','scale'+(v%30===0?' major':''));g.appendChild(ln)}}
function bindDial(el,m){const svg=el.querySelector('svg');function angle(e){const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*360/r.height;return Math.atan2(y-180,x-180)*180/Math.PI}function tap(e){const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*360/r.height,dx=x-180,dy=y-180,d=Math.hypot(dx,dy);if(d<R-45||d>R+45)return;let ca=Math.atan2(dy,dx)*180/Math.PI+90;if(ca<0)ca+=360;let steps=m.maxHp/10,s=Math.round(ca/(360/steps));if(s>=steps)s=0;m.hp=s===0?(m.hp>=m.maxHp/2?m.maxHp:0):s*10;renderDial(el,m)}el.onpointerdown=e=>{e.preventDefault();m.drag=true;m.moved=false;m.sx=e.clientX;m.sy=e.clientY;m.last=angle(e);m.acc=0;try{el.setPointerCapture(e.pointerId)}catch{}};el.onpointermove=e=>{if(!m.drag)return;e.preventDefault();if(Math.hypot(e.clientX-m.sx,e.clientY-m.sy)>=8)m.moved=true;if(!m.moved)return;let a=angle(e),diff=a-m.last;if(diff>180)diff-=360;if(diff<-180)diff+=360;m.acc+=diff;const sa=360/(m.maxHp/10);while(m.acc>=sa){m.hp=Math.min(m.maxHp,m.hp+10);m.acc-=sa}while(m.acc<=-sa){m.hp=Math.max(0,m.hp-10);m.acc+=sa}m.last=a;renderDial(el,m)};el.onpointerup=e=>{if(m.drag&&!m.moved)tap(e);m.drag=false};el.onpointercancel=()=>m.drag=false}
let mode='random',teams=[[null,null,null],[null,null,null]],active=[null,null],lastDraw=null;const sides=[...document.querySelectorAll('.side')];function used(){return teams.flat().filter(Boolean).map(m=>m.base)}function randomMonster(){const pool=names.filter(n=>!used().includes(n));return pool.length?monster(pool[Math.floor(Math.random()*pool.length)]):null}function playerName(p){return sides[p].querySelector('.playerName').value||`PLAYER ${p+1}`}
function evolveWithEffect(m,unit){if(!canEvolve(m))return;const overlay=unit.querySelector('.evoOverlay'),text=unit.querySelector('.evoText'),damage=m.maxHp-m.hp;unit.classList.add('evolving');overlay.classList.add('active');text.textContent='EVOLUTION';setTimeout(()=>{m.stage++;m.maxHp=cur(m).maxHp;m.hp=Math.max(0,m.maxHp-damage);text.textContent=cur(m).name;const title=unit.querySelector('.monname');if(title)title.textContent=cur(m).name;const av=unit.querySelector('.avatar img');if(av)av.src=cur(m).image;renderDial(unit.querySelector('.dial'),m);updateStatus()},650);setTimeout(()=>{unit.classList.remove('evolving');overlay.classList.remove('active');render();updateStatus()},1550)}
function render(){sides.forEach((side,p)=>{const team=side.querySelector('.team');team.innerHTML='';for(let slot=0;slot<3;slot++){const m=teams[p][slot],unit=document.createElement('div');unit.className='unit'+(active[p]===slot&&m?' active':'');unit.innerHTML='<span class="badge">対戦中</span>';if(mode==='free'){const sel=document.createElement('select');sel.className='pick';sel.add(new Option('ポケモン選択',''));names.forEach(n=>sel.add(new Option(n,n)));sel.value=m?m.base:'';sel.onchange=e=>{teams[p][slot]=monster(e.target.value);if(e.target.value&&active[p]===null)active[p]=slot;if(!e.target.value&&active[p]===slot)active[p]=null;render();updateStatus()};unit.appendChild(sel)}else if(!m){unit.innerHTML+='<div class="empty">未抽選</div>';team.appendChild(unit);continue}if(m){const data=attributeMaster[m.base]||['','？','','？'];const switchArea=document.createElement('div');switchArea.className='switchArea';switchArea.tabIndex=0;switchArea.setAttribute('role','button');switchArea.setAttribute('aria-label',cur(m).name+'を対戦中にする');const activate=()=>{active[p]=slot;render();updateStatus()};switchArea.onclick=activate;switchArea.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}};const title=document.createElement('button');title.className='monname';title.type='button';title.textContent=cur(m).name;title.tabIndex=-1;title.style.pointerEvents='none';switchArea.appendChild(title);const av=document.createElement('div');av.className='avatar';const im=new Image();im.src=cur(m).image;im.alt=cur(m).name;im.onerror=()=>{av.textContent='画像未登録';av.style.color='#65748a';av.style.fontSize='8px'};av.appendChild(im);switchArea.appendChild(av);const meta=document.createElement('div');meta.className='meta';meta.innerHTML=iconHtml(data[0],data[1],'TYPE')+iconHtml(data[2],data[3],'WEAK');switchArea.appendChild(meta);unit.appendChild(switchArea);const d=document.createElement('div');d.className='dial';d.innerHTML=dialMarkup();unit.appendChild(d);renderDial(d,m);bindDial(d,m);const rr=document.createElement('button');rr.className='miniReset';rr.textContent='RESET';rr.onclick=()=>{teams[p][slot]=monster(m.base);render();updateStatus()};unit.appendChild(rr);if(canEvolve(m)){const ev=document.createElement('button');ev.className='miniEvolve';ev.textContent='進化';ev.onclick=()=>evolveWithEffect(m,unit);unit.appendChild(ev)}const ov=document.createElement('div');ov.className='evoOverlay';ov.innerHTML='<span class="evoRing"></span><span class="evoRing r2"></span><span class="evoRing r3"></span><span class="evoText">EVOLUTION</span>';unit.appendChild(ov)}team.appendChild(unit)}})}
function updateStatus(){const out=document.getElementById('status');if(mode==='free'){out.textContent='各枠からポケモンを選び、名前をタップして対戦中を切り替え';return}const count=teams.flat().filter(Boolean).length;if(count>=6){out.textContent=`${playerName(0)} VS ${playerName(1)}：抽選完了`;return}out.textContent=`${playerName(count%2)} が「くじを引く」を押してください`}
document.getElementById('draw').onclick=()=>{const count=teams.flat().filter(Boolean).length;if(count>=6)return;const p=count%2,slot=teams[p].findIndex(v=>!v),m=randomMonster();if(!m)return;teams[p][slot]=m;if(active[p]===null)active[p]=slot;lastDraw={p,slot};render();updateStatus()};document.getElementById('redraw').onclick=()=>{if(!lastDraw)return;const {p,slot}=lastDraw,old=teams[p][slot];teams[p][slot]=null;teams[p][slot]=randomMonster()||old;render();updateStatus()};document.getElementById('mode').onchange=e=>{mode=e.target.value;teams=[[null,null,null],[null,null,null]];active=[null,null];lastDraw=null;document.getElementById('draw').classList.toggle('hidden',mode!=='random');document.getElementById('redraw').classList.toggle('hidden',mode!=='random');render();updateStatus()};document.getElementById('allReset').onclick=()=>{teams=[[null,null,null],[null,null,null]];active=[null,null];lastDraw=null;render();updateStatus()};sides.forEach((s,p)=>s.querySelector('.sideReset').onclick=()=>{teams[p]=[null,null,null];active[p]=null;lastDraw=null;render();updateStatus()});function height(){const h=window.visualViewport?.height||innerHeight;document.documentElement.style.setProperty('--app-height',Math.max(420,Math.floor(h)-4)+'px')}height();addEventListener('resize',height);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();updateStatus();
</script>
